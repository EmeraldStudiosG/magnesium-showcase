[package]
name = "magnesium-sys"
version = "1.1.1"
edition = "2021"
description = "Raw FFI bindings to the Magnesium language C API"
links = "magnesium"
# Distributed by `mt install rust` together with the canonical `src/` tree.
# This crate is not a self-contained crates.io package.
publish = false

[features]
default = ["vendored"]
vendored = []
system = []

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dependencies]
libc = "0.2"
