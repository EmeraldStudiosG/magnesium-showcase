[package]
name = "magnesium"
version = "1.1.1"
edition = "2021"
description = "Safe Rust wrapper for the Magnesium language VM"
# Distributed by `mt install rust` with the sibling `magnesium-sys` crate.
publish = false

[features]
default = ["vendored"]
vendored = ["magnesium-sys/vendored"]
system = ["magnesium-sys/system"]

[dependencies]
magnesium-sys = { path = "../magnesium-sys" }
libc = "0.2"
